name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0
    with:
      pre-build: uv run python docs/tools/examples.py
      smoke-paths: |
        getting-started/installation/index.html
        examples/index.html
        examples/output-format/index.html
        examples/field-maps/index.html
        example-scripts/index.html
        example-scripts/mirror-field-map/index.html
        api/takeout/index.html
        api/takeout/output/index.html
        api/takeout/field_map/index.html
        examples/field-maps/field_maps.ipynb
        example-scripts/mirror-field-map/plot-1.png
